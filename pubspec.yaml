name: loah_app
description: "Loah — app pessoal de finanças, metas e tarefas."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  font_awesome_flutter: ^11.0.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4

  # Local notifications (for foreground FCM display)
  flutter_local_notifications: ^18.0.1

  # Social Auth
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.2

  # Deep linking (password reset flow)
  app_links: ^6.3.3

  # Export
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  pdf: ^3.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
